name: Deploy to ConoHa WING (manual)

# Manual-only trigger. Do not add push/pull_request/schedule triggers here.
on:
  workflow_dispatch: {}

permissions:
  contents: read

# Only one deploy may run at a time; a second dispatch waits instead of
# cancelling a deploy that may be mid content-replacement on the remote host.
concurrency:
  group: conoha-deploy-production
  cancel-in-progress: false

env:
  REMOTE_STAGING_DIR: .scaleink-deploy-${{ github.run_id }}-${{ github.run_attempt }}
  REMOTE_BACKUP_DIR: .scaleink-backup-${{ github.run_id }}-${{ github.run_attempt }}
  REMOTE_FAILED_DIR: .scaleink-failed-${{ github.run_id }}-${{ github.run_attempt }}
  REMOTE_PROBE_NAME: .scaleink-probe-${{ github.run_id }}-${{ github.run_attempt }}
  PROD_RELATIVE_PATH: public_html/scaleink.app
  PROD_BASENAME: scaleink.app
  SITE_URL: https://scaleink.app

jobs:
  deploy:
    name: Build and deploy out/ to ConoHa WING
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies (npm ci)
        run: npm ci

      - name: Build static export (npm run build)
        run: npm run build

      # Requirement 6 (original spec): verify local build output BEFORE any
      # SSH/secret handling takes place. If any required file is missing,
      # fail here.
      - name: Verify local static export output
        run: |
          set -euo pipefail
          required_files=(
            "out/index.html"
            "out/support/index.html"
            "out/privacy/index.html"
            "out/robots.txt"
            "out/sitemap.xml"
          )
          missing=0
          for f in "${required_files[@]}"; do
            if [ ! -f "$f" ]; then
              echo "::error::Missing required build output: $f"
              missing=1
            else
              echo "OK: $f"
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "::error::One or more required static export files are missing. Aborting before any SSH setup."
            exit 1
          fi

      # Confirm secrets are present without ever printing their values.
      - name: Verify required secrets are present
        env:
          CONOHA_SSH_HOST: ${{ secrets.CONOHA_SSH_HOST }}
          CONOHA_SSH_PORT: ${{ secrets.CONOHA_SSH_PORT }}
          CONOHA_SSH_USER: ${{ secrets.CONOHA_SSH_USER }}
          CONOHA_SSH_PRIVATE_KEY: ${{ secrets.CONOHA_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          : "${CONOHA_SSH_HOST:?CONOHA_SSH_HOST secret is not set}"
          : "${CONOHA_SSH_PORT:?CONOHA_SSH_PORT secret is not set}"
          : "${CONOHA_SSH_USER:?CONOHA_SSH_USER secret is not set}"
          : "${CONOHA_SSH_PRIVATE_KEY:?CONOHA_SSH_PRIVATE_KEY secret is not set}"
          echo "All required secrets are present (values not printed)."

      # Private key goes to a temp file with 0600 permissions.
      - name: Write SSH private key to temp file
        env:
          CONOHA_SSH_PRIVATE_KEY: ${{ secrets.CONOHA_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          key_file="${RUNNER_TEMP}/conoha_deploy_key"
          umask 077
          printf '%s\n' "$CONOHA_SSH_PRIVATE_KEY" > "$key_file"
          chmod 600 "$key_file"
          echo "SSH_KEY_FILE=$key_file" >> "$GITHUB_ENV"

      # known_hosts is populated via ssh-keyscan (TOFU on first run — the
      # residual trust-on-first-use constraint this implies is documented
      # in the project's deployment notes). StrictHostKeyChecking is
      # explicitly kept at "yes" everywhere below.
      - name: Prepare known_hosts (no StrictHostKeyChecking=no)
        env:
          CONOHA_SSH_HOST: ${{ secrets.CONOHA_SSH_HOST }}
          CONOHA_SSH_PORT: ${{ secrets.CONOHA_SSH_PORT }}
        run: |
          set -euo pipefail
          known_hosts_file="${RUNNER_TEMP}/conoha_known_hosts"
          : > "$known_hosts_file"
          ssh-keyscan -p "$CONOHA_SSH_PORT" -H "$CONOHA_SSH_HOST" >> "$known_hosts_file" 2>/dev/null
          if [ ! -s "$known_hosts_file" ]; then
            echo "::error::ssh-keyscan returned no host keys; refusing to continue."
            exit 1
          fi
          echo "KNOWN_HOSTS_FILE=$known_hosts_file" >> "$GITHUB_ENV"

      # Upload out/ only, into a remote temp dir outside the public
      # directory. scp -r with a not-yet-existing remote target copies the
      # *contents* of out/ into that target directory (no nested "out"
      # folder), so REMOTE_STAGING_DIR ends up holding index.html,
      # support/index.html, etc. directly.
      - name: Upload out/ to remote staging directory
        env:
          CONOHA_SSH_HOST: ${{ secrets.CONOHA_SSH_HOST }}
          CONOHA_SSH_PORT: ${{ secrets.CONOHA_SSH_PORT }}
          CONOHA_SSH_USER: ${{ secrets.CONOHA_SSH_USER }}
        run: |
          set -euo pipefail
          ssh_opts=(
            -i "$SSH_KEY_FILE"
            -o UserKnownHostsFile="$KNOWN_HOSTS_FILE"
            -o StrictHostKeyChecking=yes
            -p "$CONOHA_SSH_PORT"
          )
          scp_opts=(
            -i "$SSH_KEY_FILE"
            -o UserKnownHostsFile="$KNOWN_HOSTS_FILE"
            -o StrictHostKeyChecking=yes
            -P "$CONOHA_SSH_PORT"
          )

          # Fail if the staging path already exists (should be unique per run).
          ssh "${ssh_opts[@]}" "${CONOHA_SSH_USER}@${CONOHA_SSH_HOST}" \
            "if [ -e \"\$HOME/${REMOTE_STAGING_DIR}\" ]; then echo 'staging dir already exists'; exit 1; fi"

          scp -r "${scp_opts[@]}" out "${CONOHA_SSH_USER}@${CONOHA_SSH_HOST}:${REMOTE_STAGING_DIR}"

      # Re-verify the required 5 files on the remote side after upload,
      # before touching production.
      - name: Verify remote staging directory contents
        env:
          CONOHA_SSH_HOST: ${{ secrets.CONOHA_SSH_HOST }}
          CONOHA_SSH_PORT: ${{ secrets.CONOHA_SSH_PORT }}
          CONOHA_SSH_USER: ${{ secrets.CONOHA_SSH_USER }}
        run: |
          set -euo pipefail
          ssh -i "$SSH_KEY_FILE" \
            -o UserKnownHostsFile="$KNOWN_HOSTS_FILE" \
            -o StrictHostKeyChecking=yes \
            -p "$CONOHA_SSH_PORT" \
            "${CONOHA_SSH_USER}@${CONOHA_SSH_HOST}" \
            "STAGING_DIR=\$HOME/${REMOTE_STAGING_DIR} bash -s" <<'REMOTE_SCRIPT'
            set -euo pipefail
            required_files=(
              "index.html"
              "support/index.html"
              "privacy/index.html"
              "robots.txt"
              "sitemap.xml"
            )
            missing=0
            for f in "${required_files[@]}"; do
              if [ ! -f "$STAGING_DIR/$f" ]; then
                echo "Missing on remote staging: $f"
                missing=1
              fi
            done
            if [ "$missing" -ne 0 ]; then
              echo "Remote staging directory verification failed."
              exit 1
            fi
            echo "Remote staging directory verified."
          REMOTE_SCRIPT

      # ConoHa WING denies renaming the domain root directory itself
      # (public_html/scaleink.app), so this step never moves, removes, or
      # recreates that directory. It only ever clears and repopulates its
      # *contents* in place, after a full content-only backup and a write
      # probe confirm the directory is safely writable. See requirements
      # 1-8 of the "in-place replacement" design for the full rationale.
      - name: Guard checks and guarded in-place replacement of production contents
        id: replace
        env:
          CONOHA_SSH_HOST: ${{ secrets.CONOHA_SSH_HOST }}
          CONOHA_SSH_PORT: ${{ secrets.CONOHA_SSH_PORT }}
          CONOHA_SSH_USER: ${{ secrets.CONOHA_SSH_USER }}
        run: |
          set -euo pipefail
          ssh -i "$SSH_KEY_FILE" \
            -o UserKnownHostsFile="$KNOWN_HOSTS_FILE" \
            -o StrictHostKeyChecking=yes \
            -p "$CONOHA_SSH_PORT" \
            "${CONOHA_SSH_USER}@${CONOHA_SSH_HOST}" \
            "STAGING_DIR=\$HOME/${REMOTE_STAGING_DIR} BACKUP_DIR=\$HOME/${REMOTE_BACKUP_DIR} PROBE_NAME=${REMOTE_PROBE_NAME} PROD_BASENAME=${PROD_BASENAME} bash -s" <<'REMOTE_SCRIPT'
            set -euo pipefail

            PUBLIC_HTML="$HOME/public_html"
            PROD_DIR="$PUBLIC_HTML/$PROD_BASENAME"

            # ---- Fixed path guards ----
            # The domain root ($PROD_DIR) is never mv'd, rm'd, or
            # recreated anywhere in this script. Only its contents are
            # ever touched, and only after every guard below passes.
            if [ -z "$PROD_DIR" ]; then
              echo "Guard failed: empty production path."
              exit 1
            fi
            if [ "$PROD_DIR" = "$HOME" ] || [ "$PROD_DIR" = "$PUBLIC_HTML" ]; then
              echo "Guard failed: refusing to target \$HOME or public_html itself."
              exit 1
            fi
            if [ "$(basename "$PROD_DIR")" != "$PROD_BASENAME" ]; then
              echo "Guard failed: basename is not exactly '$PROD_BASENAME'."
              exit 1
            fi
            if [ ! -d "$PUBLIC_HTML" ]; then
              echo "Guard failed: \$HOME/public_html does not exist."
              exit 1
            fi
            if [ -L "$PROD_DIR" ]; then
              echo "Guard failed: production path is a symlink, refusing to proceed."
              exit 1
            fi
            if [ ! -d "$PROD_DIR" ]; then
              echo "Guard failed: production directory does not already exist."
              exit 1
            fi
            if [ ! -d "$STAGING_DIR" ]; then
              echo "Guard failed: staging directory is missing."
              exit 1
            fi
            if [ -e "$BACKUP_DIR" ]; then
              echo "Guard failed: backup path already exists."
              exit 1
            fi

            # Resolve real paths (pwd -P, no external realpath dependency)
            # and re-check identity against the resolved values too, as
            # defense against any parent-directory symlink tricks.
            PROD_DIR_REAL="$(cd "$PROD_DIR" && pwd -P)"
            PUBLIC_HTML_REAL="$(cd "$PUBLIC_HTML" && pwd -P)"
            HOME_REAL="$(cd "$HOME" && pwd -P)"

            if [ -z "$PROD_DIR_REAL" ]; then
              echo "Guard failed: could not resolve real path of production directory."
              exit 1
            fi
            if [ "$PROD_DIR_REAL" = "$HOME_REAL" ] || [ "$PROD_DIR_REAL" = "$PUBLIC_HTML_REAL" ]; then
              echo "Guard failed: resolved production path collapses to \$HOME or public_html."
              exit 1
            fi
            if [ "$(basename "$PROD_DIR_REAL")" != "$PROD_BASENAME" ]; then
              echo "Guard failed: resolved basename is not exactly '$PROD_BASENAME'."
              exit 1
            fi

            # ---- Content-only clear helper ----
            # Shared by the in-place replacement below and both rollback
            # paths. Refuses anything that is not exactly the guarded,
            # resolved production path, and only ever removes the
            # directory's direct children (never the directory itself),
            # using find instead of a glob so dotfiles are included.
            clear_directory_contents() {
              local target="$1"
              if [ -z "$target" ]; then
                echo "CRITICAL: clear_directory_contents called with empty target."
                return 1
              fi
              if [ "$target" != "$PROD_DIR_REAL" ]; then
                echo "CRITICAL: clear_directory_contents target does not match the guarded production path."
                return 1
              fi
              if [ "$target" = "$HOME_REAL" ] || [ "$target" = "$PUBLIC_HTML_REAL" ]; then
                echo "CRITICAL: clear_directory_contents refuses to target \$HOME or public_html."
                return 1
              fi
              if [ ! -d "$target" ]; then
                echo "CRITICAL: clear_directory_contents target is not a directory."
                return 1
              fi

              if ! find "$target" -mindepth 1 -maxdepth 1 -exec rm -rf -- {} +; then
                echo "CRITICAL: clear_directory_contents: find/rm reported a non-zero exit status for $target."
                return 1
              fi

              if find "$target" -mindepth 1 -print -quit | grep -q .; then
                echo "CRITICAL: clear_directory_contents: directory contents were not completely removed: $target"
                return 1
              fi

              return 0
            }

            # ---- Step 1 of 9: staging required files ----
            for f in index.html support/index.html privacy/index.html robots.txt sitemap.xml; do
              if [ ! -f "$STAGING_DIR/$f" ]; then
                echo "Guard failed: staging missing $f immediately before replacement."
                exit 1
              fi
            done

            # ---- Step 2 of 9: production write probe ----
            # Confirms create, rename, and delete permissions inside the
            # production directory before anything real is touched. Uses a
            # run/attempt-scoped name so concurrent runs cannot collide,
            # and never reuses an existing file or directory.
            PROBE_PATH="$PROD_DIR/$PROBE_NAME"
            PROBE_RENAMED="$PROD_DIR/${PROBE_NAME}.renamed"

            if [ -e "$PROBE_PATH" ] || [ -e "$PROBE_RENAMED" ]; then
              echo "Guard failed: write probe path already exists in production directory."
              exit 1
            fi

            if ! ( : > "$PROBE_PATH" ) 2>/dev/null; then
              echo "Guard failed: could not create a write probe file in production directory (no write permission)."
              exit 1
            fi

            if ! mv "$PROBE_PATH" "$PROBE_RENAMED" 2>/dev/null; then
              echo "Guard failed: could not rename the write probe file in production directory (no rename permission)."
              rm -f "$PROBE_PATH" 2>/dev/null || true
              exit 1
            fi

            if ! rm -f "$PROBE_RENAMED" 2>/dev/null; then
              echo "Guard failed: could not delete the write probe file in production directory (no delete permission)."
              exit 1
            fi

            echo "Write probe succeeded: production directory supports create, rename, and delete of files."

            # ---- Step 3 of 9: preserve .htaccess / .well-known into staging ----
            if [ -f "$PROD_DIR/.htaccess" ]; then
              if [ -e "$STAGING_DIR/.htaccess" ]; then
                echo "Guard failed: staging already contains .htaccess; refusing to overwrite unexpectedly."
                exit 1
              fi
              cp -p "$PROD_DIR/.htaccess" "$STAGING_DIR/.htaccess"
              echo "Preserved existing .htaccess into staging."
            else
              echo "No existing .htaccess to preserve."
            fi

            if [ -d "$PROD_DIR/.well-known" ]; then
              if [ -e "$STAGING_DIR/.well-known" ]; then
                echo "Guard failed: staging already contains .well-known; refusing to overwrite unexpectedly."
                exit 1
              fi
              cp -a "$PROD_DIR/.well-known" "$STAGING_DIR/.well-known"
              echo "Preserved existing .well-known into staging."
            else
              echo "No existing .well-known to preserve."
            fi

            # ---- Step 4 of 9: production contents backup (content-only, outside public_html) ----
            if ! mkdir "$BACKUP_DIR"; then
              echo "Guard failed: could not create backup directory. Production not touched."
              exit 1
            fi

            if ! cp -a "$PROD_DIR/." "$BACKUP_DIR/"; then
              echo "Guard failed: could not copy production contents into backup. Production not touched."
              exit 1
            fi

            # ---- Step 5 of 9: backup required files ----
            for f in index.html support/index.html privacy/index.html robots.txt sitemap.xml; do
              if [ ! -f "$BACKUP_DIR/$f" ]; then
                echo "Guard failed: backup is missing required file $f. Production not touched."
                exit 1
              fi
            done
            echo "Backup verified: all required files present in $BACKUP_DIR."

            # ---- Steps 6-8 of 9: clear production, copy staging in, verify ----
            # From here on, production contents are touched. Any failure
            # triggers an immediate, explicit in-place rollback below
            # rather than relying on set -e to unwind anything.
            REPLACEMENT_OK=1

            if ! clear_directory_contents "$PROD_DIR_REAL"; then
              echo "In-place replacement failed: could not clear production contents."
              REPLACEMENT_OK=0
            fi

            # Re-confirm the production root itself still exists (it is
            # never removed by clear_directory_contents) and that its
            # contents are genuinely empty before copying staging in.
            if [ "$REPLACEMENT_OK" -eq 1 ]; then
              if [ ! -d "$PROD_DIR" ]; then
                echo "In-place replacement failed: production directory itself is missing after clearing contents."
                REPLACEMENT_OK=0
              elif find "$PROD_DIR" -mindepth 1 -print -quit | grep -q .; then
                echo "In-place replacement failed: production directory is not empty after clearing contents."
                REPLACEMENT_OK=0
              fi
            fi

            if [ "$REPLACEMENT_OK" -eq 1 ]; then
              if ! cp -a "$STAGING_DIR/." "$PROD_DIR/"; then
                echo "In-place replacement failed: could not copy staging contents into production."
                REPLACEMENT_OK=0
              fi
            fi

            if [ "$REPLACEMENT_OK" -eq 1 ]; then
              for f in index.html support/index.html privacy/index.html robots.txt sitemap.xml; do
                if [ ! -f "$PROD_DIR/$f" ]; then
                  echo "In-place replacement failed: production is missing required file $f after copy."
                  REPLACEMENT_OK=0
                  break
                fi
              done
            fi

            if [ "$REPLACEMENT_OK" -eq 1 ]; then
              echo "Guarded in-place replacement complete: production contents now match staging. Backup kept at $BACKUP_DIR."
              exit 0
            fi

            # ---- Internal rollback (production contents only) ----
            echo "Starting internal rollback to restore production contents from backup."

            # Re-confirm the guarded path before touching production again.
            if [ "$PROD_DIR_REAL" != "$(cd "$PUBLIC_HTML" && pwd -P)/$PROD_BASENAME" ]; then
              echo "CRITICAL: guard re-check failed before internal rollback. Refusing to touch production further. Manual intervention required."
              exit 1
            fi

            ROLLBACK_OK=1

            if ! clear_directory_contents "$PROD_DIR_REAL"; then
              echo "CRITICAL: internal rollback could not clear partially-replaced production contents."
              ROLLBACK_OK=0
            fi

            if [ "$ROLLBACK_OK" -eq 1 ]; then
              if [ ! -d "$PROD_DIR" ]; then
                echo "CRITICAL: internal rollback found production directory itself missing after clearing contents."
                ROLLBACK_OK=0
              elif find "$PROD_DIR" -mindepth 1 -print -quit | grep -q .; then
                echo "CRITICAL: internal rollback found production directory not empty after clearing contents."
                ROLLBACK_OK=0
              fi
            fi

            if [ "$ROLLBACK_OK" -eq 1 ]; then
              if ! cp -a "$BACKUP_DIR/." "$PROD_DIR/"; then
                echo "CRITICAL: internal rollback could not copy backup contents back into production."
                ROLLBACK_OK=0
              fi
            fi

            if [ "$ROLLBACK_OK" -eq 1 ]; then
              for f in index.html support/index.html privacy/index.html robots.txt sitemap.xml; do
                if [ ! -f "$PROD_DIR/$f" ]; then
                  echo "CRITICAL: internal rollback restored production but required file $f is missing."
                  ROLLBACK_OK=0
                  break
                fi
              done
            fi

            if [ "$ROLLBACK_OK" -eq 1 ]; then
              echo "Internal rollback succeeded: production contents restored from backup."
            else
              echo "CRITICAL: internal rollback did not fully succeed. Production directory contents may be in an inconsistent state. Manual intervention required. Backup retained at $BACKUP_DIR."
            fi

            # The primary replacement failed, so this step always exits
            # non-zero regardless of whether the internal rollback above
            # fully succeeded.
            exit 1
          REMOTE_SCRIPT

          echo "replaced=true" >> "$GITHUB_OUTPUT"

      # Verify the live site from the runner, over HTTPS, following
      # redirects, and require a final 200.
      - name: Verify production over HTTPS
        id: https_verify
        run: |
          set -euo pipefail
          routes=(
            "/"
            "/support/"
            "/privacy/"
            "/robots.txt"
            "/sitemap.xml"
          )
          failed=0
          for route in "${routes[@]}"; do
            code=$(curl -s -L -o /dev/null -w "%{http_code}" "${SITE_URL}${route}" || echo "000")
            echo "${route} -> ${code}"
            if [ "$code" != "200" ]; then
              failed=1
            fi
          done
          if [ "$failed" -ne 0 ]; then
            echo "::error::One or more production routes did not return a final HTTP 200."
            exit 1
          fi

      # On HTTPS verification failure, restore production contents from
      # backup in place. The domain root directory itself is never moved
      # or removed here either.
      - name: Restore production contents on verification failure
        if: ${{ failure() && steps.replace.outcome == 'success' }}
        env:
          CONOHA_SSH_HOST: ${{ secrets.CONOHA_SSH_HOST }}
          CONOHA_SSH_PORT: ${{ secrets.CONOHA_SSH_PORT }}
          CONOHA_SSH_USER: ${{ secrets.CONOHA_SSH_USER }}
        run: |
          set -euo pipefail
          ssh -i "$SSH_KEY_FILE" \
            -o UserKnownHostsFile="$KNOWN_HOSTS_FILE" \
            -o StrictHostKeyChecking=yes \
            -p "$CONOHA_SSH_PORT" \
            "${CONOHA_SSH_USER}@${CONOHA_SSH_HOST}" \
            "BACKUP_DIR=\$HOME/${REMOTE_BACKUP_DIR} FAILED_DIR=\$HOME/${REMOTE_FAILED_DIR} PROD_BASENAME=${PROD_BASENAME} bash -s" <<'REMOTE_SCRIPT'
            set -euo pipefail
            PUBLIC_HTML="$HOME/public_html"
            PROD_DIR="$PUBLIC_HTML/$PROD_BASENAME"

            # Re-establish the same fixed guards as the replacement step.
            if [ -z "$PROD_DIR" ] || [ "$PROD_DIR" = "$HOME" ] || [ "$PROD_DIR" = "$PUBLIC_HTML" ]; then
              echo "CRITICAL: guard failed before HTTPS-failure rollback. Refusing to proceed."
              exit 1
            fi
            if [ "$(basename "$PROD_DIR")" != "$PROD_BASENAME" ]; then
              echo "CRITICAL: basename guard failed before HTTPS-failure rollback."
              exit 1
            fi
            if [ -L "$PROD_DIR" ]; then
              echo "CRITICAL: production path is a symlink. Refusing to proceed."
              exit 1
            fi
            if [ ! -d "$PROD_DIR" ]; then
              echo "CRITICAL: production directory missing before HTTPS-failure rollback."
              exit 1
            fi
            if [ ! -d "$BACKUP_DIR" ]; then
              echo "CRITICAL: no backup directory found to restore from. Manual intervention required."
              exit 1
            fi

            PROD_DIR_REAL="$(cd "$PROD_DIR" && pwd -P)"
            PUBLIC_HTML_REAL="$(cd "$PUBLIC_HTML" && pwd -P)"
            HOME_REAL="$(cd "$HOME" && pwd -P)"

            # Same content-only clear helper as the replacement step
            # (duplicated here because each workflow step is an
            # independent SSH session and cannot share shell functions).
            clear_directory_contents() {
              local target="$1"
              if [ -z "$target" ]; then
                echo "CRITICAL: clear_directory_contents called with empty target."
                return 1
              fi
              if [ "$target" != "$PROD_DIR_REAL" ]; then
                echo "CRITICAL: clear_directory_contents target does not match the guarded production path."
                return 1
              fi
              if [ "$target" = "$HOME_REAL" ] || [ "$target" = "$PUBLIC_HTML_REAL" ]; then
                echo "CRITICAL: clear_directory_contents refuses to target \$HOME or public_html."
                return 1
              fi
              if [ ! -d "$target" ]; then
                echo "CRITICAL: clear_directory_contents target is not a directory."
                return 1
              fi

              if ! find "$target" -mindepth 1 -maxdepth 1 -exec rm -rf -- {} +; then
                echo "CRITICAL: clear_directory_contents: find/rm reported a non-zero exit status for $target."
                return 1
              fi

              if find "$target" -mindepth 1 -print -quit | grep -q .; then
                echo "CRITICAL: clear_directory_contents: directory contents were not completely removed: $target"
                return 1
              fi

              return 0
            }

            # Preserve the current (failing) production contents outside
            # public_html for diagnosis. This directory is intentionally
            # left behind for inspection even after a successful rollback.
            if ! mkdir "$FAILED_DIR"; then
              echo "CRITICAL: could not create diagnostic FAILED_DIR. Continuing rollback without preserving failing content."
            else
              if cp -a "$PROD_DIR/." "$FAILED_DIR/"; then
                echo "Copied failing production contents to $FAILED_DIR for diagnosis."
              else
                echo "CRITICAL: could not copy failing production contents into FAILED_DIR for diagnosis. Continuing rollback."
              fi
            fi

            ROLLBACK_OK=1

            if ! clear_directory_contents "$PROD_DIR_REAL"; then
              echo "CRITICAL: could not clear production contents during HTTPS-failure rollback."
              ROLLBACK_OK=0
            fi

            if [ "$ROLLBACK_OK" -eq 1 ]; then
              if [ ! -d "$PROD_DIR" ]; then
                echo "CRITICAL: HTTPS-failure rollback found production directory itself missing after clearing contents."
                ROLLBACK_OK=0
              elif find "$PROD_DIR" -mindepth 1 -print -quit | grep -q .; then
                echo "CRITICAL: HTTPS-failure rollback found production directory not empty after clearing contents."
                ROLLBACK_OK=0
              fi
            fi

            if [ "$ROLLBACK_OK" -eq 1 ]; then
              if ! cp -a "$BACKUP_DIR/." "$PROD_DIR/"; then
                echo "CRITICAL: could not copy backup contents back into production during HTTPS-failure rollback."
                ROLLBACK_OK=0
              fi
            fi

            if [ "$ROLLBACK_OK" -eq 1 ]; then
              for f in index.html support/index.html privacy/index.html robots.txt sitemap.xml; do
                if [ ! -f "$PROD_DIR/$f" ]; then
                  echo "CRITICAL: restored production is missing required file $f."
                  ROLLBACK_OK=0
                  break
                fi
              done
            fi

            if [ "$ROLLBACK_OK" -eq 1 ]; then
              echo "Restored previous production contents from backup after HTTPS verification failure."
            else
              echo "CRITICAL: HTTPS-failure rollback did not fully succeed. Production directory contents may be in an inconsistent state. Manual intervention required. Backup retained at $BACKUP_DIR, failing content retained at $FAILED_DIR."
              exit 1
            fi
          REMOTE_SCRIPT

      # Only clean up this run's backup/staging remnants on full success.
      - name: Clean up backup and staging on success
        if: ${{ success() }}
        env:
          CONOHA_SSH_HOST: ${{ secrets.CONOHA_SSH_HOST }}
          CONOHA_SSH_PORT: ${{ secrets.CONOHA_SSH_PORT }}
          CONOHA_SSH_USER: ${{ secrets.CONOHA_SSH_USER }}
        run: |
          set -euo pipefail
          ssh -i "$SSH_KEY_FILE" \
            -o UserKnownHostsFile="$KNOWN_HOSTS_FILE" \
            -o StrictHostKeyChecking=yes \
            -p "$CONOHA_SSH_PORT" \
            "${CONOHA_SSH_USER}@${CONOHA_SSH_HOST}" \
            "BACKUP_DIR=\$HOME/${REMOTE_BACKUP_DIR} STAGING_DIR=\$HOME/${REMOTE_STAGING_DIR} bash -s" <<'REMOTE_SCRIPT'
            set -euo pipefail

            # Only ever delete paths matching this run's own generated
            # prefixes. This never matches a previous run's leftover
            # staging directory (those carry a different run id/attempt).
            case "$BACKUP_DIR" in
              "$HOME"/.scaleink-backup-*) : ;;
              *)
                echo "CRITICAL: BACKUP_DIR does not match the expected prefix, refusing to delete: $BACKUP_DIR"
                exit 1
                ;;
            esac
            case "$STAGING_DIR" in
              "$HOME"/.scaleink-deploy-*) : ;;
              *)
                echo "CRITICAL: STAGING_DIR does not match the expected prefix, refusing to delete: $STAGING_DIR"
                exit 1
                ;;
            esac

            if [ -d "$BACKUP_DIR" ]; then
              rm -rf "$BACKUP_DIR"
              echo "Removed this run's backup directory."
            fi
            if [ -d "$STAGING_DIR" ]; then
              rm -rf "$STAGING_DIR"
              echo "Removed this run's staging directory."
            fi
          REMOTE_SCRIPT

      # Always remove the private key file from the runner.
      - name: Remove SSH private key from runner
        if: ${{ always() }}
        run: |
          if [ -n "${SSH_KEY_FILE:-}" ] && [ -f "${SSH_KEY_FILE}" ]; then
            rm -f "${SSH_KEY_FILE}"
            echo "Removed temporary SSH private key file."
          fi
